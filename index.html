<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Fan Hub Lounge</title>
    <style>
        body { background-color: #0f0f0f; color: #f1f1f1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background-color: #212121; display: flex; flex-direction: column; flex-shrink: 0; border-right: 1px solid #3d3d3d; }
        .channel-header { height: 56px; display: flex; align-items: center; padding: 0 16px; font-weight: bold; font-size: 18px; color: #ff0000; border-bottom: 1px solid #3d3d3d; gap: 8px; }
        .yt-logo { font-size: 22px; }
        .sidebar-menu { flex: 1; padding: 12px 8px; display: flex; flex-direction: column; gap: 4px; }
        .menu-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: background 0.2s; }
        .menu-item.active { background-color: #ff0000; color: white; }
        .menu-item:hover:not(.active) { background-color: #383838; }
        .chat-view { flex: 1; display: flex; flex-direction: column; background-color: #0f0f0f; }
        .chat-header { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid #3d3d3d; background-color: #212121; }
        .chat-title { font-weight: 600; font-size: 16px; }
        .sub-counter { font-size: 12px; color: #aaa; background: #383838; padding: 4px 10px; border-radius: 12px; font-weight: bold; }
        .message-feed { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
        .msg-box { display: flex; gap: 16px; }
        .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; flex-shrink: 0; font-size: 14px; }
        .msg-info { display: flex; flex-direction: column; }
        .msg-meta { display: flex; align-items: baseline; gap: 8px; }
        .msg-user { font-weight: 600; color: #fff; font-size: 14px; }
        .msg-badge { font-size: 10px; background-color: #ff0000; color: white; padding: 2px 6px; border-radius: 4px; font-weight: bold; }
        .msg-time { font-size: 11px; color: #aaa; }
        .msg-text { color: #f1f1f1; font-size: 14px; margin: 6px 0 0 0; line-height: 1.4; }
        .input-wrapper { padding: 24px; padding-top: 0; }
        .chat-form { background-color: #212121; border: 1px solid #3d3d3d; border-radius: 24px; padding: 12px 20px; display: flex; }
        .chat-input { background: transparent; border: none; width: 100%; color: #f1f1f1; font-size: 14px; outline: none; }
        .chat-input::placeholder { color: #aaa; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="channel-header"><span class="yt-logo">▶</span> Creator Hub</div>
        <div class="sidebar-menu">
            <div class="menu-item active">💬 Live Fan Chat</div>
        </div>
    </div>

    <div class="chat-view">
        <div class="chat-header">
            <div class="chat-title">💬 Live Fan Chat</div>
            <div class="sub-counter">🔴 Global Fan Lounge</div>
        </div>
        
        <div id="message-container" class="message-feed"></div>

        <div class="input-wrapper">
            <form id="message-form" class="chat-form">
                <input id="message-input" type="text" autocomplete="off" placeholder="Send a message to the stream crew..." class="chat-input">
            </form>
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION: PUT YOUR CORRECT CRDENTIALS HERE!
        // ==========================================
        const SUPABASE_URL = "https://supabase.co"; 
        const SUPABASE_ANON_KEY = "sb_publishable_2GEHtwgyC3pxzdW2eEaJKw_6oe51y8M";

        const messageContainer = document.getElementById('message-container');
        const messageForm = document.getElementById('message-form');
        const messageInput = document.getElementById('message-input');

        const randomID = Math.floor(100 + Math.random() * 900);
        const myUsername = "Fan_" + randomID;

        function appendMessage(user, text, timestamp = new Date()) {
            const msgDiv = document.createElement('div');
            msgDiv.className = "msg-box";
            const time = new Date(timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const avatarColor = user === myUsername ? "#10b981" : "#0284c7";

            msgDiv.innerHTML = `
                <div class="avatar" style="background-color: ${avatarColor}">${user.charAt(0).toUpperCase()}</div>
                <div class="msg-info">
                    <div class="msg-meta">
                        <span class="msg-user">${user}</span>
                        <span class="msg-time">${time}</span>
                    </div>
                    <p class="msg-text">${text}</p>
                </div>
            `;
            messageContainer.appendChild(msgDiv);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        function logSystem(text) {
            const div = document.createElement('div');
            div.style.cssText = "font-size: 12px; color: #aaa; background: #212121; padding: 8px; border-radius: 8px; border: 1px solid #3d3d3d; font-style: italic;";
            div.textContent = `⚙️ ${text}`;
            messageContainer.appendChild(div);
            messageContainer.scrollTop = messageContainer.scrollHeight;
        }

        async function fetchHistory() {
            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/messages?order=created_at.asc&limit=50`, {
                    method: 'GET',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const data = await res.json();
                messageContainer.innerHTML = '';
                if (data && data.length > 0) {
                    data.forEach(msg => appendMessage(msg.username, msg.content, msg.created_at));
                }
                logSystem("Live Chat Connected!");
            } catch (err) {
                logSystem("Connecting...");
            }
        }

        messageForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = messageInput.value.trim();
            if (!text) return;

            messageInput.value = '';
            appendMessage(myUsername, text);

            try {
                await fetch(`${SUPABASE_URL}/rest/v1/messages`, {
                    method: 'POST',
                    headers: {
                        'apikey': SUPABASE_ANON_KEY,
                        'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: myUsername, content: text })
                });
            } catch (err) {
                logSystem("Failed to sync message.");
            }
        });

        fetchHistory();
        setInterval(fetchHistory, 3000); // Polls database every 3 seconds for new global messages
    </script>
</body>
</html>
